<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minecraft Mini</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">BLOCKY ADVENTURE</p>
          <h1>Minecraft Mini</h1>
        </div>
        <div class="hud">
          <span>Health: <strong id="health">10</strong></span>
          <span>Blocks: <strong id="blocks">0</strong></span>
        </div>
      </header>

      <main class="game-panel">
        <canvas id="gameCanvas" width="960" height="540"></canvas>
      </main>

      <section class="controls">
        <div>
          <h2>Controls</h2>
          <p>Move: WASD / Arrow Keys</p>
          <p>Mine: Spacebar</p>
          <p>Restart: R</p>
        </div>
        <div>
          <h2>Goal</h2>
          <p>Collect blocks, avoid the lava, and survive the adventure.</p>
        </div>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
