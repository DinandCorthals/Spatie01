<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minecraft 3D Mini</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Minecraft 3D</p>
          <h1>Block World</h1>
        </div>
        <div class="hud" aria-live="polite">
          <span>❤️ Health: <strong id="health">20</strong></span>
          <span>⛏️ Blocks: <strong id="blocks">0</strong></span>
        </div>
      </header>

      <main class="game-panel">
        <canvas id="gameCanvas" width="960" height="540" tabindex="0"></canvas>
      </main>

      <section class="controls">
        <div>
          <h2>Controls</h2>
          <p>Move: WASD / Arrow Keys</p>
          <p>Mine: Spacebar</p>
          <p>Restart: R</p>
        </div>
        <div>
          <h2>Goal</h2>
          <p>Move around the 3D-style world, collect blocks, and avoid lava.</p>
        </div>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
