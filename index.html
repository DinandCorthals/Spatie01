<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minecraft Mini</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">🎮 BLOCKY ADVENTURE</p>
          <h1>Minecraft Mini</h1>
        </div>
        <div class="hud" aria-live="polite">
          <span>❤️ Health: <strong id="health">20</strong></span>
          <span>⛏️ Resources: <strong id="blocks">0</strong></span>
        </div>
      </header>

      <main class="game-panel">
        <canvas id="gameCanvas" width="960" height="540" tabindex="0"></canvas>
      </main>

      <section class="controls">
        <div>
          <h2>🎮 Controls</h2>
          <p><strong>Move:</strong> WASD or Arrow Keys</p>
          <p><strong>Mine:</strong> Spacebar</p>
          <p><strong>Restart:</strong> R</p>
        </div>
        <div>
          <h2>🎯 Gameplay</h2>
          <p>Verzamel ores (Coal, Iron, Gold, Diamond) en avoid lava!</p>
          <p>Diamond = 5 points | Gold = 3 | Iron = 2 | Coal = 1</p>
          <p>Walk through water to slow down (strategy!)</p>
        </div>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
